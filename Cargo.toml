[package]
name = "webcraft"
version = "0.25.0"
edition = "2021"
description = "Clean-room cross-platform download manager (IDM feature clone)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks", "json", "blocking"] }
async-trait = "0.1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
# NNTP TLS. default-features=false keeps ring provider (already via reqwest).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
url = "2"
sha2 = "0.10"
md-5 = "0.10"
aes = "0.8"
cbc = "0.1"
directories = "5"
futures-util = "0.3"
russh = "0.64"
russh-sftp = "3"
# BitTorrent. default-features off: drops default-tls (native-tls) + http-api-client; rust-tls reuses ring/rustls stack already in tree. No http-api/postgres/prometheus.
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
# NZB auto-unpack. zip/sevenz pure Rust (no zstd: keeps C deps out).
# unrar-ng = vendored UnRAR C++ (cc build: needs MSVC/gcc/clang in build env only).
unrar-ng = "=0.7.7"
zip = { version = "=9.0.5", default-features = false, features = ["deflate", "aes-crypto", "bzip2", "lzma", "ppmd", "deflate64"] }
sevenz-rust2 = { version = "=0.24.1", default-features = false, features = ["util", "aes256", "compress", "ppmd", "bzip2", "deflate"] }
# Drives: rclone-crypt compat (scrypt keys, XSalsa20-Poly1305 secretbox,
# AES-EME name encryption), S3 SigV4 uses hmac+sha2. aes already above.
crypto_secretbox = "0.1"
ctr = "0.9"
hmac = "0.12"
scrypt = "0.11"
sha1 = "0.10"
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11"] }
egui = "0.29"
rfd = "0.15"
arboard = "3"
tray-icon = "0.19"
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[lib]
name = "downloadcraft_lib"
path = "src/lib.rs"

[[bin]]
name = "webcraft"
path = "src/main.rs"

[[bin]]
name = "webcraft-host"
path = "src/bin/webcraft_host.rs"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
