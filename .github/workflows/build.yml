name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: universal-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned: -D warnings clippy turns new stable lints into CI failures.
      # Bump deliberately after running cargo clippy --all-targets -- -D warnings.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg (test fixtures + mux verification)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg || true; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y || winget install --id Gyan.FFmpeg -e --accept-source-agreements --accept-package-agreements || true; fi
          ffmpeg -version | head -1 || true
      - name: Linux GUI deps (egui glow/x11/wayland + tray)
        if: runner.os == 'Linux'
        # egui needs X11/Wayland + GL libs; rfd needs gtk3; tray-icon needs libappindicator
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libwayland-dev libgl1-mesa-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libxkbcommon-dev
      - name: Windows NSIS (setup exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y; Get-Command makensis -ErrorAction SilentlyContinue | Select-Object Source
      - name: Linux appimagetool (AppImage)
        if: runner.os == 'Linux'
        run: |
          curl -sL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool && sudo mv /tmp/appimagetool /usr/local/bin/appimagetool || true
          appimagetool --version || true
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Test (Node)
        run: node extensions/rank.test.mjs
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/webcraft target/x86_64-apple-darwin/release/webcraft target/aarch64-apple-darwin/release/webcraft
          lipo -create -output target/universal/webcraft-host target/x86_64-apple-darwin/release/webcraft-host target/aarch64-apple-darwin/release/webcraft-host
          mkdir -p target/release && cp target/universal/* target/release/
      - name: Build release
        if: runner.os != 'macOS'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Normalize release dir (non-macOS)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/webcraft* target/release/ 2>/dev/null || true
          ls target/release/
      - name: Smoke test
        shell: bash
        run: |
          BIN=target/release/webcraft
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=target/release/webcraft.exe; fi
          "$BIN" --smoke-test
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 ${{ github.ref_name }}
      - name: Package Firefox XPI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-firefox.ps1; Copy-Item extensions/webcraft-firefox.xpi dist/ -ErrorAction SilentlyContinue
      - name: Package Chromium zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Force -Path extensions/chromium/* -DestinationPath dist/webcraft-chromium.zip
      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh ${{ github.ref_name }}
      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh ${{ github.ref_name }}
      - name: Checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum * > SHA256SUMS.txt; else shasum -a 256 * > SHA256SUMS.txt; fi
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: webcraft-${{ runner.os }}-${{ matrix.target }}
          path: dist/*

  release:
    # Single job after full matrix: avoids 3-way race creating/uploading same release
    # (both softprops step and per-job gh upload failed on all OS).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + checksum
        shell: bash
        run: |
          mkdir -p dist
          for d in artifacts/*/; do for f in "$d"*; do b=$(basename "$f"); case "$b" in SHA256SUMS*) cp "$f" "dist/$(basename "$d")-SHA256SUMS.txt";; *) cp "$f" "dist/$b";; esac; done; done
          ls -la dist
          V="${{ github.ref_name }}"
          for f in "dist/webcraft-${V}-windows-x86_64.zip" "dist/webcraft-${V}-windows-setup.exe" "dist/webcraft-${V}-universal.dmg" "dist/webcraft-${V}-linux-x86_64.tar.gz" "dist/webcraft-${V}-x86_64.AppImage" "dist/webcraft_${V#v}_amd64.deb" dist/webcraft-chromium.zip dist/webcraft-firefox.xpi; do test -f "$f" || { echo "MISSING expected asset: $f"; ls -la dist; exit 1; }; done
          cd dist && sha256sum $(ls | grep -v SHA256SUMS || true) > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release + upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # no checkout assumption: pass --repo explicitly (gh cannot infer repo from artifact dir)
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" dist/* --clobber
